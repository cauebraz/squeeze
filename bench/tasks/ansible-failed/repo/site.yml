- name: Prepare application hosts
  hosts: app
  connection: local
  gather_facts: false
  vars:
    app_root: "{{ playbook_dir }}/out/{{ inventory_hostname }}"
  tasks:
    - name: Create the application root
      ansible.builtin.file:
        path: "{{ app_root }}"
        state: directory
        mode: "0755"

    - name: Create the application directories
      ansible.builtin.file:
        path: "{{ app_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ app_dirs }}"

    - name: Write the message of the day
      ansible.builtin.copy:
        content: "Welcome to {{ app_name }} on {{ inventory_hostname }}\n"
        dest: "{{ app_root }}/etc/motd"
        mode: "0644"

    - name: Install the logrotate policy
      ansible.builtin.copy:
        src: logrotate.conf
        dest: "{{ app_root }}/etc/logrotate.conf"
        mode: "0644"

    - name: Write the hosts file
      ansible.builtin.copy:
        content: "127.0.0.1 localhost\n"
        dest: "{{ app_root }}/etc/hosts"
        mode: "0644"
        force: false

    - name: Add the service names to the hosts file
      ansible.builtin.lineinfile:
        path: "{{ app_root }}/etc/hosts"
        line: "127.0.0.1 {{ item }}"
      loop:
        - "{{ inventory_hostname }}"
        - "{{ inventory_hostname }}.example.test"
        - "{{ app_name }}.local"

    - name: Render the environment file
      ansible.builtin.template:
        src: app.env.j2
        dest: "{{ app_root }}/etc/app.env"
        mode: "0644"

    - name: Render the virtual host
      ansible.builtin.template:
        src: vhost.conf.j2
        dest: "{{ app_root }}/etc/vhost.conf"
        mode: "0644"

    - name: Install the helper scripts
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ app_root }}/bin/{{ item.dest }}"
        mode: "0755"
      loop: "{{ common_scripts + extra_scripts }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: Render the application configuration
      ansible.builtin.template:
        src: app.conf.j2
        dest: "{{ app_root }}/etc/app.conf"
        mode: "0644"

    - name: Set the log directory in the environment file
      ansible.builtin.lineinfile:
        path: "{{ app_root }}/etc/app.env"
        regexp: "^APP_LOG_DIR="
        line: "APP_LOG_DIR={{ app_root }}/log"

    - name: Add the binary directory to the path
      ansible.builtin.lineinfile:
        path: "{{ app_root }}/etc/app.env"
        line: "PATH={{ app_root }}/bin:/usr/bin:/bin"

    - name: Read the rendered configuration
      ansible.builtin.stat:
        path: "{{ app_root }}/etc/app.conf"
      register: app_conf

    - name: Check the configuration was rendered
      ansible.builtin.assert:
        that:
          - app_conf.stat.exists
          - app_conf.stat.size > 0

    - name: Check the log level
      ansible.builtin.assert:
        that:
          - log_level in ['debug', 'info', 'warning', 'error']
        fail_msg: "log_level {{ log_level }} is not one of debug, info, warning, error"

    - name: Check the listen port
      ansible.builtin.assert:
        that:
          - app_port | int >= 1024
          - app_port | int < 65536

    - name: Write the version file
      ansible.builtin.copy:
        content: "{{ app_version }}\n"
        dest: "{{ app_root }}/etc/VERSION"
        mode: "0644"

    - name: Show the deployed version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} runs {{ app_name }} {{ app_version }} on port {{ app_port }}"

- name: Mark the hosts ready
  hosts: app
  connection: local
  gather_facts: false
  vars:
    app_root: "{{ playbook_dir }}/out/{{ inventory_hostname }}"
  tasks:
    - name: List the installed scripts
      ansible.builtin.find:
        paths: "{{ app_root }}/bin"
        patterns: "*.sh"
      register: scripts

    - name: Write the ready marker
      ansible.builtin.copy:
        content: "ready with {{ scripts.matched }} scripts\n"
        dest: "{{ app_root }}/run/ready"
        mode: "0644"
